name: check

on:
  push:
  pull_request:

env:
  KTLINT_VERSION: 1.7.1
  TAPLO_VERSION: 0.10.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tauri linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v2
      - name: Install taplo
        run: |
          curl -fsSL "https://github.com/tamasfe/taplo/releases/download/${TAPLO_VERSION}/taplo-linux-x86_64.gz" | gunzip > /usr/local/bin/taplo
          chmod +x /usr/local/bin/taplo
      - name: Build ui
        run: cd ui && bun install --frozen-lockfile && bun run build
      - name: Format, lint, test
        run: just src check
      - name: ktlint
        run: |
          curl -fsSLo /usr/local/bin/ktlint "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x /usr/local/bin/ktlint
          ktlint "src-tauri/gen/android/app/src/main/java/com/kokoroand/tts/*.kt"
